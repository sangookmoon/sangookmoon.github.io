<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="alternate" hreflang="ko" href="https://sangookmoon.github.io/publications.html">
<title>Publications | Sangook Moon</title>
<meta name="description" content="Sangook Moon, Professor of Electrical and Electronic Engineering at Mokwon University. Hardware security, FPGA, cryptographic hardware, industrial IoT.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header class="top"><div class="wrap">
  <a class="site" href="/en/">Sangook Moon<span>Mokwon University</span></a>
  <nav class="menu"><a href="/en/">About</a><a class="on" href="/en/publications.html">Publications</a><a href="/en/teaching/">Teaching</a><a class="lang" href="/publications.html" hreflang="ko" lang="ko">한국어</a></nav>
</div></header>

<main><div class="wrap">
  <h1>Publications</h1>
  <p class="sub" id="meta">From Google Scholar</p>
  <div class="filter"><input id="q" type="search" placeholder="Search title, author, or venue" aria-label="Search publications"><span class="note" id="cnt"></span></div>
  <div id="list"></div>
  <p class="note" style="margin-top:24px">The full list with citation details is on <a href="https://scholar.google.com/citations?user=AWfixSwAAAAJ">Google Scholar</a>.</p>
</div></main>

<footer><div class="wrap">© 2026 Sangook Moon · Last updated 2026-11-22</div></footer>
<script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let all=[];
function render(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const L=all.filter(p=>!q||(p.title+' '+p.authors+' '+p.venue).toLowerCase().includes(q));
  document.getElementById('cnt').textContent=L.length+(L.length===1?' paper':' papers');
  let html='',y=null;
  for(const p of L){
    const yr=p.year||'Year unknown';
    if(yr!==y){html+='<div class="pubyear">'+esc(yr)+'</div>';y=yr;}
    const a=esc(p.authors).replace(/S Moon|SG Moon|S-G Moon|SangGook Moon|Sangook Moon/g,m=>'<b>'+m+'</b>');
    html+='<div class="pub"><div class="t">'+esc(p.title)+'</div><div class="a">'+a+'</div><div class="v">'+esc(p.venue)+(p.cites?' <span class="c">· cited by '+p.cites+'</span>':'')+'</div></div>';
  }
  document.getElementById('list').innerHTML=html;
}
fetch('/assets/publications.json').then(r=>r.json()).then(d=>{
  all=d.pubs; document.getElementById('meta').textContent='From Google Scholar · '+d.citations+' citations · h-index '+d.h+' · i10-index '+d.i10+' · updated '+d.updated;
  render();
});
document.getElementById('q').addEventListener('input',render);
</script>
</body>
</html>
