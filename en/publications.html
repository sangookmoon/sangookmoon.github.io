<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Publications | Sangook Moon</title>
<meta name="description" content="Sangook Moon, Professor of Electrical and Electronic Engineering, Mokwon University. Hardware security, FPGA, cryptographic hardware, industrial IoT.">
<link rel="alternate" hreflang="ko" href="https://sangookmoon.github.io/publications.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/assets/style.css?v=202611231207">
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><a class="univ" href="https://www.mokwon.ac.kr/en/" title="Mokwon University"><img class="lg-l" src="/assets/logo.svg" alt="Mokwon University" width="130" height="33"><img class="lg-d" src="/assets/logo-dark.svg" alt="" width="130" height="33"></a><a class="nm" href="https://www.mokwon.ac.kr/electronics/" title="Department of Electrical and Electronic Engineering, Mokwon University">Dept. of EEE</a></div>
  <nav class="menu"><a href="/en/">About</a><a class="on" href="/en/publications.html">Publications</a><a href="/en/teaching/">Teaching</a><a class="lang" href="/publications.html" hreflang="ko" lang="ko">한국어</a></nav>
</div></header>

<main><div class="wrap">
  <h1>Publications</h1>
  <p class="sub" id="meta">From Google Scholar</p>
  <div class="filter"><input id="q" type="search" placeholder="Search title, author, or venue" aria-label="Search publications"><span class="seg" role="radiogroup"><label><input type="radio" name="kind" value="all" checked>All</label><label><input type="radio" name="kind" value="journal">Journals</label><label><input type="radio" name="kind" value="conference">Conferences</label></span><span class="note" id="cnt"></span></div>
  <div id="list"></div>
  <p class="note" style="margin-top:28px">The full list with citation details is on <a href="https://scholar.google.com/citations?user=AWfixSwAAAAJ">Google Scholar</a>.</p>
</div></main>

<footer><div class="wrap"><a class="univ" href="https://www.mokwon.ac.kr/en/" title="Mokwon University"><img class="lg-l" src="/assets/logo.svg" alt="Mokwon University" width="130" height="33"><img class="lg-d" src="/assets/logo-dark.svg" alt="" width="130" height="33"></a><span>© 2026 Sangook Moon</span><span>Last updated 2026-11-23</span></div></footer>
<script>
const L10N={count:n=>n+(n===1?' paper':' papers'),noyear:'Year unknown',cited:n=>'cited by '+n,meta:d=>'From Google Scholar · <span class="nw">'+d.citations+' citations</span> · <span class="nw">h-index '+d.h+'</span> · <span class="nw">i10-index '+d.i10+'</span> · updated '+d.updated};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let all=[];
function render(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const k=document.querySelector('input[name=kind]:checked').value;
  const L=all.filter(p=>!p.hidden&&(k==='all'||p.kind===k)&&(!q||(p.title+' '+p.authors+' '+(p.venue_full||p.venue)).toLowerCase().includes(q)));
  document.getElementById('cnt').textContent=L10N.count(L.length);
  let html='',y=null;
  for(const p of L){
    const yr=p.year||L10N.noyear;
    if(yr!==y){html+='<div class="pubyear">'+esc(yr)+'</div>';y=yr;}
    const a=esc(p.authors).replace(/S Moon|SG Moon|S-G Moon|SangGook Moon|Sangook Moon|S\. Moon/g,m=>'<b>'+m+'</b>');
    const t=p.url?'<a href="'+esc(p.url)+'">'+esc(p.title)+'</a>':esc(p.title);
    html+='<div class="pub"><div class="t">'+t+'</div><div class="a">'+a+'</div><div class="v">'+esc(p.venue_full||p.venue)+(p.cites?' <span class="c">· '+L10N.cited(p.cites)+'</span>':'')+'</div></div>';
  }
  document.getElementById('list').innerHTML=html;
}
fetch('/assets/publications.json').then(r=>r.json()).then(d=>{
  all=d.pubs; document.getElementById('meta').innerHTML=L10N.meta(d);
  render();
});
document.getElementById('q').addEventListener('input',render);
document.querySelectorAll('input[name=kind]').forEach(e=>e.addEventListener('change',render));
</script>
</body>
</html>
